name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v2

      - name: Setup Micromamba ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=${{ matrix.python-version }} pip nco
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-opendap
        shell: bash -l {0}
        run: >
          python -m pip install git+https://github.com/xpublish-community/xpublish.git
          && python -m pip install -e . --no-deps --force-reinstall
          && micromamba info
          && micromamba list

      - name: Tests
        shell: bash -l {0}
        run: |
          python -m pytest -rxs --cov=xpublish_opendap --cov-report=xml tests

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v3

  integration-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=3.13 pip nco r-base r-ncdf4
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-opendap
        shell: bash -l {0}
        run: >
          python -m pip install git+https://github.com/xpublish-community/xpublish.git
          && python -m pip install -e . --no-deps --force-reinstall

      - name: R integration tests
        shell: bash -l {0}
        run: |
          python -m pytest -rxs tests/integration/test_r_client.py

  integration-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: TEST
          init-shell: bash
          create-args: >-
            python=3.13 pip nco
            --file requirements.txt
            --file requirements-dev.txt
            --channel conda-forge

      - name: Install xpublish-opendap
        shell: bash -l {0}
        run: >
          python -m pip install git+https://github.com/xpublish-community/xpublish.git
          && python -m pip install -e . --no-deps --force-reinstall

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-depot-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            julia-depot-${{ runner.os }}-

      - name: Install NCDatasets.jl
        run: julia -e 'using Pkg; Pkg.add("NCDatasets")'

      - name: Julia integration tests
        shell: bash -l {0}
        run: |
          python -m pytest -rxs tests/integration/test_julia_client.py
